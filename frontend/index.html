<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RapCheck</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--surface:#141414;--surface2:#1a1a1a;--text:#e8e8e8;--dim:#555;--accent:#FF1493;--green:#00E676;--gold:#FFD700;--red:#FF4444;--cyan:#00E5FF}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;min-height:100vh}

.header{padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1a1a1a}
.logo{font-size:22px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.song-info{text-align:right}
.song-title{font-size:15px;font-weight:600}
.song-artist{font-size:12px;color:var(--dim)}

.container{display:flex;flex-direction:column;align-items:center;padding:32px 16px;max-width:720px;margin:0 auto}

/* Song select */
.song-select{background:var(--surface);border-radius:16px;padding:28px;width:100%;max-width:460px;margin-bottom:32px}
.song-select h2{font-size:18px;margin-bottom:14px;font-weight:700}
.song-list{display:flex;flex-direction:column;gap:6px}
.song-btn{background:var(--surface2);border:1px solid #2a2a2a;border-radius:10px;padding:14px 18px;color:var(--text);font-family:inherit;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all .2s}
.song-btn:hover{border-color:var(--accent);background:rgba(255,20,147,.04)}
.song-btn .n{font-weight:800;font-size:12px;color:var(--accent);width:20px}

/* Lyrics */
.lyrics-box{width:100%;background:var(--surface);border-radius:16px;padding:28px 24px;margin-bottom:20px;min-height:240px;max-height:360px;overflow-y:auto;scroll-behavior:smooth}
.line{font-size:18px;font-weight:500;line-height:1.5;text-align:center;padding:5px 0;transition:all .25s;color:var(--dim)}
.line.active{color:var(--text);font-size:22px;font-weight:700}
.line.past{opacity:.35}
.w{display:inline-block;transition:all .12s;padding:0 1px;border-radius:3px}
.w.now{color:var(--accent);text-shadow:0 0 16px rgba(255,20,147,.3);transform:scale(1.08)}
.w.done{color:var(--green)}

/* Controls */
.controls{display:flex;gap:12px;align-items:center;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.btn{border:none;border-radius:40px;padding:12px 28px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-go{background:var(--accent);color:#fff}
.btn-go:hover:not(:disabled){transform:scale(1.04);box-shadow:0 4px 16px rgba(255,20,147,.25)}
.btn-stop{background:rgba(255,68,68,.12);color:var(--red);border:1px solid rgba(255,68,68,.25)}
.btn-back{background:var(--surface2);color:var(--text);border:1px solid #2a2a2a}
.mic-dot{width:10px;height:10px;border-radius:50%;background:#333}
.mic-dot.on{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,68,68,.6)}50%{box-shadow:0 0 0 6px rgba(255,68,68,0)}}

.progress{width:100%;height:3px;background:#1a1a1a;border-radius:2px;margin-bottom:12px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);width:0%;transition:width .1s linear}

.hint{text-align:center;color:var(--dim);font-size:12px}

/* Countdown */
.countdown{position:fixed;inset:0;background:rgba(10,10,10,.92);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s}
.countdown.on{opacity:1;pointer-events:auto}
.countdown-num{font-size:110px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:cpop .8s ease-out}
@keyframes cpop{0%{transform:scale(1.4);opacity:0}50%{transform:scale(1);opacity:1}}

/* Grade */
.grade-card{background:var(--surface);border-radius:16px;padding:32px;width:100%;max-width:440px;text-align:center;display:none}
.grade-card.show{display:block}
.grade-letter{font-size:72px;font-weight:900;margin:12px 0}
.grade-letter.S{color:var(--gold);text-shadow:0 0 24px rgba(255,215,0,.4)}
.grade-letter.A{color:var(--green)}
.grade-letter.B{color:var(--cyan)}
.grade-letter.C{color:var(--gold)}
.grade-letter.D{color:#FF9800}
.grade-letter.F{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.stat{background:var(--surface2);border-radius:10px;padding:14px}
.stat-v{font-size:24px;font-weight:800}
.stat-l{font-size:11px;color:var(--dim);margin-top:2px}
.breakdown{text-align:left;margin-top:20px}
.breakdown h3{font-size:12px;color:var(--dim);margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
.brow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1a1a1a;font-size:13px}
.ok{color:var(--green)}.mid{color:var(--gold)}.bad{color:var(--red)}

.hidden{display:none!important}

/* Section picker */
.sec-label{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:2px 8px;border-radius:4px;margin-right:8px}
.sec-verse{background:rgba(0,229,255,.12);color:var(--cyan)}
.sec-chorus{background:rgba(255,20,147,.12);color:var(--accent)}
.sec-intro{background:rgba(255,215,0,.1);color:var(--gold)}
.sec-outro{background:rgba(85,85,85,.2);color:var(--dim)}

/* Grading spinner */
.grading-overlay{position:fixed;inset:0;background:rgba(10,10,10,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s}
.grading-overlay.on{opacity:1;pointer-events:auto}
.spinner{width:40px;height:40px;border:3px solid #333;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.grading-text{color:var(--text);margin-top:16px;font-size:15px;font-weight:500}
</style>
</head>
<body>

<div class="header">
  <div class="logo">RAPCHECK</div>
  <div class="song-info">
    <div class="song-title" id="hTitle">Select a Song</div>
    <div class="song-artist" id="hArtist">Karaoke MVP</div>
  </div>
</div>

<div class="container">
  <!-- SETUP -->
  <div id="setup">
    <div style="text-align:center;margin-bottom:28px">
      <h1 style="font-size:42px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent">RAPCHECK</h1>
      <p style="color:var(--dim);font-size:15px">Pick a song. Rap it. Get graded.</p>
    </div>
    <div class="song-select">
      <h2>Choose a Track</h2>
      <div class="song-list" id="songList"></div>
    </div>
  </div>

  <!-- PERFORMANCE -->
  <div id="perf" class="hidden">
    <!-- SECTION PICKER -->
    <div id="clipPicker" style="width:100%;background:var(--surface);border-radius:14px;padding:20px;margin-bottom:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <span style="font-size:14px;font-weight:600">Pick a section to rap</span>
        <button class="btn btn-back" style="padding:6px 14px;font-size:12px" onclick="selectAll()">Full Song</button>
      </div>
      <div id="clipList" style="display:flex;flex-direction:column;gap:6px"></div>
    </div>
    <div class="progress"><div class="progress-fill" id="pFill"></div></div>
    <div class="lyrics-box" id="lyricsBox"></div>
    <div class="controls">
      <button class="btn btn-go" id="goBtn" onclick="start()">▶ Play &amp; Rap</button>
      <button class="btn btn-stop hidden" id="stopBtn" onclick="stop()">■ Stop</button>
      <button class="btn btn-back" id="muteBtn" onclick="toggleMute()" style="font-size:18px" title="Toggle song audio">🔊</button>
      <button class="btn btn-back" onclick="home()">← Back</button>
      <div class="mic-dot" id="micDot"></div>
    </div>
    <div class="hint" id="muteHint">Song audio on — use headphones for best results</div>
  </div>

  <!-- GRADE -->
  <div class="grade-card" id="gradeCard">
    <div style="font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:2px">Your Grade</div>
    <div class="grade-letter" id="gLetter">-</div>
    <div class="stats">
      <div class="stat"><div class="stat-v" id="gAcc">--%</div><div class="stat-l">Accuracy</div></div>
      <div class="stat"><div class="stat-v" id="gTime">--%</div><div class="stat-l">Timing</div></div>
      <div class="stat"><div class="stat-v" id="gScore">--</div><div class="stat-l">Score</div></div>
    </div>
    <div class="breakdown" id="gBreak"></div>
    <div style="margin-top:20px;display:flex;gap:10px;justify-content:center">
      <button class="btn btn-go" onclick="retry()">Try Again</button>
      <button class="btn btn-back" onclick="home()">Pick Another</button>
    </div>
  </div>
</div>

<!-- COUNTDOWN -->
<div class="countdown" id="cdOverlay">
  <div class="countdown-num" id="cdNum">3</div>
</div>

<!-- GRADING SPINNER -->
<div class="grading-overlay" id="gradingOverlay">
  <div class="spinner"></div>
  <div class="grading-text">Grading your performance...</div>
</div>

<audio id="audio" preload="auto"></audio>

<script>
let song=null, gt=null, rec=null, chunks=[], recording=false, raf=null;
let clipStart=null, clipEnd=null;
let muted=false;
let grading=false; // guard against double finish()

async function init(){
  try{
    const r=await fetch('/api/songs');
    const songs=await r.json();
    const list=document.getElementById('songList');
    songs.forEach((s,i)=>{
      const b=document.createElement('button');
      b.className='song-btn';
      const nm=s.song_name||s.name||'unknown';
      const dur=s.duration_seconds||s.duration||0;
      b.innerHTML='<span class="n">'+(i+1)+'</span>'+nm+'<span style="color:var(--dim);margin-left:auto;font-size:12px">'+(dur?dur.toFixed(0)+'s':'')+'</span>';
      b.onclick=function(){pickSong(s)};
      list.appendChild(b);
    });
  }catch(e){console.error(e)}
}

async function pickSong(s){
  const nm=s.song_name||s.name||'unknown';
  const audio_file=s.audio_file||s.audio||'';
  song={name:nm,audio:audio_file};
  document.getElementById('hTitle').textContent=nm;
  document.getElementById('hArtist').textContent='J. Cole';
  const r=await fetch('/songs/'+nm+'/ground_truth.json');
  gt=await r.json();
  document.getElementById('audio').src='/songs/'+nm+'/'+audio_file;
  showPerf();
}

function showPerf(){
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('gradeCard').classList.remove('show');
  document.getElementById('perf').classList.remove('hidden');
  clipStart=null;clipEnd=null;
  buildSections();
  buildLyrics();
}

function home(){
  stop();
  grading=false;
  document.getElementById('perf').classList.add('hidden');
  document.getElementById('gradeCard').classList.remove('show');
  document.getElementById('setup').classList.remove('hidden');
}

function buildLyrics(){
  const box=document.getElementById('lyricsBox');
  box.innerHTML='';
  if(!gt||!gt.words){box.innerHTML='<div class="line" style="padding:40px">No lyrics</div>';return}

  // Filter words to clip if set
  let words=gt.words;
  if(clipStart!==null&&clipEnd!==null){
    words=gt.words.filter(w=>w.start>=clipStart&&w.end<=clipEnd);
  }

  // Group words into lines (7-word chunks for natural readability)
  const lines=[];
  let cur=[];
  words.forEach((w,i)=>{
    cur.push({...w,i:gt.words.indexOf(w)});
    if(cur.length>=7){lines.push(cur);cur=[]}
  });
  if(cur.length)lines.push(cur);

  lines.forEach(lw=>{
    const el=document.createElement('div');
    el.className='line';
    el.dataset.s=lw[0].start;
    el.dataset.e=lw[lw.length-1].end;
    lw.forEach(wd=>{
      const sp=document.createElement('span');
      sp.className='w';
      sp.textContent=wd.word;
      sp.dataset.s=wd.start;
      sp.dataset.e=wd.end;
      sp.dataset.i=wd.i;
      el.appendChild(sp);
      el.appendChild(document.createTextNode(' '));
    });
    box.appendChild(el);
  });
}

function detectSections(){
  // Detect verse/chorus sections from word timestamps
  if(!gt||!gt.words||gt.words.length===0)return[];
  let words=gt.words.filter(w=>!Array.from(w.word).some(c=>c.codePointAt(0)>0xFFFF));
  const gapThresh=0.6, minWords=25;

  // Find breaks (large gaps between words)
  const breaks=[0];
  for(let i=1;i<words.length;i++){
    if(words[i].start-words[i-1].end>=gapThresh)breaks.push(i);
  }
  breaks.push(words.length);

  // Build raw sections
  const raw=[];
  for(let i=0;i<breaks.length-1;i++){
    const sw=words.slice(breaks[i],breaks[i+1]);
    raw.push({start:sw[0].start,end:sw[sw.length-1].end,
      text:sw.map(w=>w.word).join(' '),wc:sw.length});
  }

  // Merge small sections
  let merged=[raw[0]];
  for(let i=1;i<raw.length;i++){
    if(merged[merged.length-1].wc<minWords){
      const p=merged[merged.length-1];
      p.end=raw[i].end;p.text+=' '+raw[i].text;p.wc+=raw[i].wc;
    }else merged.push(raw[i]);
  }
  // Final merge pass
  const final=[merged[0]];
  for(let i=1;i<merged.length;i++){
    if(merged[i].wc<minWords&&final.length>0){
      const p=final[final.length-1];
      p.end=merged[i].end;p.text+=' '+merged[i].text;p.wc+=merged[i].wc;
    }else final.push(merged[i]);
  }

  // Chorus detection: repeated opening phrases
  for(const s of final){
    const toks=s.text.toLowerCase().split();
    s.sig=toks.slice(0,5).join(' ');
  }
  const sigCounts={};
  for(const s of final)sigCounts[s.sig]=(sigCounts[s.sig]||0)+1;
  const chorusSigs=new Set();
  for(const[s,c]of Object.entries(sigCounts))if(c>=2)chorusSigs.add(s);
  // Partial overlap check
  const sigSets=final.map(s=>new Set(s.sig.split()));
  for(let i=0;i<sigSets.length;i++){
    for(let j=i+1;j<sigSets.length;j++){
      if(!sigSets[i].size||!sigSets[j].size)continue;
      let overlap=0;
      for(const w of sigSets[i])if(sigSets[j].has(w))overlap++;
      if(overlap/Math.min(sigSets[i].size,sigSets[j].size)>=0.6){
        chorusSigs.add(final[i].sig);chorusSigs.add(final[j].sig);
      }
    }
  }

  // Label
  for(let i=0;i<final.length;i++){
    const s=final[i];
    if(i===0&&s.wc<15)s.label='intro';
    else if(i===final.length-1&&s.wc<20)s.label='outro';
    else if(chorusSigs.has(s.sig))s.label='chorus';
    else s.label='verse';
  }

  return final.map(s=>({label:s.label,start:s.start,end:s.end,
    word_count:s.wc,preview:s.text.slice(0,80)+(s.text.length>80?'...':'')}));
}

function buildSections(){
  const list=document.getElementById('clipList');
  list.innerHTML='';
  const sections=detectSections();
  if(!sections.length)return;

  sections.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='song-btn';
    const m1=Math.floor(c.start/60),s1=Math.floor(c.start%60);
    const m2=Math.floor(c.end/60),s2=Math.floor(c.end%60);
    const labelClass='sec-'+c.label;
    const dur=((c.end-c.start)).toFixed(0);
    b.innerHTML='<span class="n">'+(i+1)+'</span><div style="text-align:left"><div style="font-size:13px"><span class="sec-label '+labelClass+'">'+c.label+'</span>'+m1+':'+(s1<10?'0':'')+s1+' — '+m2+':'+(s2<10?'0':'')+s2+' ('+dur+'s)</div><div style="font-size:11px;color:var(--dim);margin-top:2px">'+c.word_count+' words — '+c.preview+'</div></div>';
    b.onclick=function(){
      clipStart=c.start;clipEnd=c.end;
      document.getElementById('clipPicker').style.borderColor='var(--accent)';
      buildLyrics();
      list.querySelectorAll('.song-btn').forEach(x=>x.style.borderColor='#2a2a2a');
      b.style.borderColor='var(--accent)';
    };
    list.appendChild(b);
  });
}

function selectAll(){
  clipStart=null;clipEnd=null;
  document.getElementById('clipPicker').style.borderColor='';
  buildLyrics();
  document.getElementById('clipList').querySelectorAll('.song-btn').forEach(x=>x.style.borderColor='#2a2a2a');
}

function toggleMute(){
  muted=!muted;
  const a=document.getElementById('audio');
  a.muted=muted;
  const btn=document.getElementById('muteBtn');
  const hint=document.getElementById('muteHint');
  if(muted){
    btn.textContent='🔇';
    hint.textContent='Song muted — lyrics sync still active';
  }else{
    btn.textContent='🔊';
    hint.textContent='Song audio on — use headphones for best results';
  }
}

function fmtTime(s){
  const m=Math.floor(s/60);
  const sec=Math.floor(s%60);
  return m+':'+(sec<10?'0':'')+sec;
}

function formatTime(s){
  if(s===null||s===undefined)return'';
  return'+'+s.toFixed(1)+'s';
}

async function start(){
  if(!song||!gt)return;
  const audio=document.getElementById('audio');
  audio.currentTime=clipStart||0;

  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,sampleRate:44100}});
    chunks=[];
    rec=new MediaRecorder(stream,{mimeType:'audio/webm;codecs=opus'});
    rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
    rec.start(100);
    recording=true;

    document.getElementById('micDot').classList.add('on');
    document.getElementById('goBtn').classList.add('hidden');
    document.getElementById('stopBtn').classList.remove('hidden');

    await countdown();

    // If clip selected, stop at clip end
    if(clipEnd!==null){
      audio.ontimeupdate=function(){
        if(audio.currentTime>=clipEnd){finish()}
      };
    }else{
      audio.ontimeupdate=null;
    }

    audio.play();
    animate();
    audio.onended=()=>finish();
  }catch(e){
    alert('Mic access required. Please allow and retry.');
  }
}

async function countdown(){
  const o=document.getElementById('cdOverlay');
  const n=document.getElementById('cdNum');
  o.classList.add('on');
  for(let i=3;i>=1;i--){
    n.textContent=i;
    n.style.animation='none';n.offsetHeight;n.style.animation='cpop .8s ease-out';
    await new Promise(r=>setTimeout(r,900));
  }
  n.textContent='GO!';
  await new Promise(r=>setTimeout(r,400));
  o.classList.remove('on');
}

function animate(){
  const audio=document.getElementById('audio');
  const box=document.getElementById('lyricsBox');
  const fill=document.getElementById('pFill');

  function tick(){
    if(!recording)return;
    const t=audio.currentTime;
    const dur=audio.duration||1;
    fill.style.width=`${(t/dur)*100}%`;

    const words=document.querySelectorAll('.w');
    let activeLine=null;
    words.forEach(w=>{
      const ws=parseFloat(w.dataset.s), we=parseFloat(w.dataset.e);
      w.classList.remove('now','done');
      if(t>=ws&&t<=we){w.classList.add('now');activeLine=w.parentElement}
      else if(t>we)w.classList.add('done');
    });

    const lines=document.querySelectorAll('.line');
    lines.forEach(l=>{
      const ls=parseFloat(l.dataset.s), le=parseFloat(l.dataset.e);
      l.classList.remove('active','past');
      if(t>=ls&&t<=le){l.classList.add('active');activeLine=l}
      else if(t>le)l.classList.add('past');
    });

    if(activeLine){
      const br=box.getBoundingClientRect();
      const lr=activeLine.getBoundingClientRect();
      if(lr.top<br.top+40||lr.bottom>br.bottom-40){
        activeLine.scrollIntoView({behavior:'smooth',block:'center'});
      }
    }
    raf=requestAnimationFrame(tick);
  }
  raf=requestAnimationFrame(tick);
}

function stop(){
  recording=false;
  grading=false;
  if(raf)cancelAnimationFrame(raf);
  const a=document.getElementById('audio');
  a.pause();a.currentTime=0;
  if(rec&&rec.state!=='inactive'){rec.stop();rec.stream.getTracks().forEach(t=>t.stop())}
  document.getElementById('micDot').classList.remove('on');
  document.getElementById('goBtn').classList.remove('hidden');
  document.getElementById('stopBtn').classList.add('hidden');
  document.getElementById('pFill').style.width='0%';
}

async function finish(){
  if(grading)return;
  grading=true;
  recording=false;
  // Kill audio handlers so they can't re-fire
  const a=document.getElementById('audio');
  a.onended=null;
  a.ontimeupdate=null;
  if(raf)cancelAnimationFrame(raf);
  if(rec&&rec.state!=='inactive'){rec.stop();rec.stream.getTracks().forEach(t=>t.stop())}
  document.getElementById('micDot').classList.remove('on');
  document.getElementById('goBtn').classList.remove('hidden');
  document.getElementById('stopBtn').classList.add('hidden');

  await new Promise(r=>setTimeout(r,300));

  const blob=new Blob(chunks,{type:'audio/webm'});
  console.log(`Recording: ${blob.size} bytes`);

  // Show grading spinner
  document.getElementById('gradingOverlay').classList.add('on');

  // Send to backend for real grading
  const reader=new FileReader();
  reader.onload=async()=>{
    const b64=reader.result.split(',')[1];
    try{
      const r=await fetch('/api/grade',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({song:song.name,audio:b64,clip_start:clipStart,clip_end:clipEnd})
      });
      const grade=await r.json();
      document.getElementById('gradingOverlay').classList.remove('on');
      if(grade.error){alert('Grading error: '+grade.error);return}
      showGrade(grade);
    }catch(e){
      document.getElementById('gradingOverlay').classList.remove('on');
      alert('Grading failed: '+e.message);
    }
  };
  reader.readAsDataURL(blob);
}

function retry(){
  clipStart=null;clipEnd=null;
  if(song)pickSong(song);
}

function showGrade(g){
  grading=false;
  document.getElementById('perf').classList.add('hidden');
  document.getElementById('gradeCard').classList.add('show');
  const letter=document.getElementById('gLetter');
  letter.textContent=g.grade;
  letter.className='grade-letter '+g.grade;
  document.getElementById('gAcc').textContent=g.accuracy+'%';
  document.getElementById('gTime').textContent=g.timing+'%';
  document.getElementById('gScore').textContent=g.score+'/'+g.max;

  // Build word-by-word transcript
  let transcript='';
  if(g.details&&g.details.length){
    transcript='<div style="margin-top:20px;text-align:left"><h3 style="font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Time-Aligned Transcript</h3>';
    transcript+='<div style="display:grid;grid-template-columns:60px 1fr 1fr 50px;gap:2px 8px;font-size:13px;line-height:1.8">';
    transcript+='<div style="color:var(--dim);font-weight:600;font-size:11px">TIME</div>';
    transcript+='<div style="color:var(--dim);font-weight:600;font-size:11px">EXPECTED</div>';
    transcript+='<div style="color:var(--dim);font-weight:600;font-size:11px">YOU SAID</div>';
    transcript+='<div style="color:var(--dim);font-weight:600;font-size:11px">SCORE</div>';
    g.details.forEach(w=>{
      const t=w.diff!==null?formatTime(w.diff):'';
      const exp=w.expected||'—';
      const said=w.word;
      let expStyle='', saidStyle='';
      if(w.status==='correct'){
        saidStyle='color:var(--green)';
      }else if(w.status==='late'){
        saidStyle='color:var(--gold)';
      }else{
        saidStyle='color:var(--red);text-decoration:line-through';
        expStyle='color:var(--green);font-weight:600';
      }
      transcript+='<div style="color:var(--dim)">'+(w.diff!==null?'+'+w.diff+'s':'')+'</div>';
      transcript+='<div style="'+expStyle+'">'+exp+'</div>';
      transcript+='<div style="'+saidStyle+'">'+said+'</div>';
      transcript+='<div style="color:var(--dim)">'+w.score+'</div>';
    });
    transcript+='</div></div>';
  }

  document.getElementById('gBreak').innerHTML=`
    <h3>Breakdown</h3>
    <div class="brow"><span>Correct words</span><span class="ok">${g.correct}</span></div>
    <div class="brow"><span>Right word, off timing</span><span class="mid">${g.partial}</span></div>
    <div class="brow"><span>Missed</span><span class="bad">${g.missed}</span></div>
    <div class="brow"><span>Flow recoveries</span><span style="color:var(--cyan)">${g.flow_recoveries}</span></div>
    <div class="brow"><span>Your words / expected</span><span>${g.user_words} / ${g.total_words}</span></div>
    ${transcript}`;
}

init();
</script>
</body>
</html>
